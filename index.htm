<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&family=Noto+Serif+TC:wght@500;600&family=Noto+Serif+JP:wght@500;600&family=Noto+Serif+KR:wght@500;600&display=swap">
<style>
/* Layout: full-screen 3D walk; HUD as Prussian-night glass cards; map styled as an old parchment plan. */
:root{
  --prussian:#003153; --night:#061827; --glass:rgba(5,24,40,.84);
  --gold:#eec464; --gold-deep:#b98a2a; --parchment:#f4ecd8; --ink:#13202c;
  --violet:#b79ac4; --muted:rgba(244,236,216,.62); --line:rgba(238,196,100,.32);
  --display:'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --body:'Jost', 'Avenir Next', system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--parchment);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
html:lang(zh-Hant){--display:'Cormorant Garamond','Noto Serif TC','PMingLiU',serif}
html:lang(ja){--display:'Cormorant Garamond','Noto Serif JP','Hiragino Mincho ProN',serif}
html:lang(ko){--display:'Cormorant Garamond','Noto Serif KR','Batang',serif}
html:lang(zh-Hant) #intro h1 em,html:lang(ja) #intro h1 em,html:lang(ko) #intro h1 em{font-style:normal}
html:lang(zh-Hant) #intro h1,html:lang(ja) #intro h1,html:lang(ko) #intro h1{font-size:clamp(38px,6.6vw,64px);line-height:1.15}
.langs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 26px}
.langs button{background:none;border:1px solid var(--line);border-radius:2px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.langs button:hover{color:var(--parchment);border-color:var(--gold)}
.langs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.langs.mini{margin:10px 0 0;gap:3px}.langs.mini button{padding:2px 6px;font-size:11px}
.row{display:flex;gap:6px;flex-wrap:wrap}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Intro */
#intro{position:fixed;inset:0;display:flex;overflow-y:auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 52px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 40%,rgba(0,49,83,.35),rgba(3,14,26,.86) 70%);z-index:20}
#intro .panel{max-width:540px;width:100%;text-align:left;margin:auto}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
#intro h1{font-family:var(--display);font-weight:600;font-size:clamp(44px,8vw,76px);line-height:.95;margin:.25em 0 .3em;text-wrap:balance;color:var(--parchment)}
#intro h1 em{font-style:italic;color:var(--gold);font-weight:500}
#intro p{font-size:16px;line-height:1.6;color:rgba(244,236,216,.86);max-width:60ch;margin:0 0 1em}
#intro .keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:18px 0 26px;color:var(--muted)}
#intro .keys kbd{font-family:var(--body);font-size:12px;border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--parchment);white-space:nowrap}
#begin{background:var(--gold);color:var(--ink);border:0;border-radius:2px;padding:14px 28px;font-weight:600;letter-spacing:.06em;font-size:15px}
#begin:hover{background:#f5d585}
#intro small{display:block;margin-top:22px;font-size:12px;color:var(--muted);line-height:1.5}
#intro .touch-only{display:none}
@media (pointer:coarse){#intro .touch-only{display:grid}#intro .desk-only{display:none}}

/* HUD */
#hud[hidden]{display:none!important}
.card{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));width:262px;
  background:var(--glass);border:1px solid var(--line);border-radius:4px;padding:14px 16px 12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.card .eyebrow{display:flex;justify-content:space-between;align-items:baseline}
.stats{display:flex;gap:22px;margin:6px 0 8px}
.stat b{font-family:var(--display);font-size:44px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums lining-nums;line-height:1}
.stat span{font-family:var(--display);font-size:24px;color:var(--muted)}
.stat small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
#listToggle{background:none;border:0;padding:4px 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--parchment);display:flex;gap:6px;align-items:center;width:100%;border-top:1px solid var(--line);padding-top:9px}
#listToggle i{font-style:normal;transition:transform .2s;color:var(--gold)}
#listToggle[aria-expanded="false"] i{transform:rotate(-90deg)}
#blist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:1px}
#blist li{display:grid;grid-template-columns:30px 1fr auto;align-items:baseline;padding:3px 0;font-size:13.5px;color:var(--muted)}
#blist .num{font-family:var(--display);font-weight:700;font-size:15px;color:rgba(238,196,100,.55)}
#blist .nm{min-width:0}
#blist .nm small{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px;opacity:.7}
#blist .ct{font-variant-numeric:tabular-nums;font-size:13px}
#blist li.on{color:var(--parchment)}
#blist li.on .num{color:var(--gold)}
#blist li.on .ct{color:var(--gold)}
#blist li.twice .ct{color:var(--violet)}
#blist li.here{background:rgba(238,196,100,.1);margin:0 -8px;padding:3px 8px}
#euler{font-size:12.5px;line-height:1.45;color:rgba(244,236,216,.82);margin:10px 0 8px;border-top:1px solid var(--line);padding-top:9px}
#euler b{color:var(--gold);font-weight:500}
#reset,#menu{background:none;border:1px solid var(--line);border-radius:2px;padding:5px 10px;font-size:12px;color:var(--parchment)}
#reset:hover,#menu:hover{border-color:var(--gold)}
#menu{border-color:rgba(238,196,100,.6);color:var(--gold)}

#mapwrap{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
  padding:5px;background:var(--glass);border:1px solid var(--line);border-radius:4px;cursor:zoom-in}
#mapwrap.big{top:50%;right:50%;transform:translate(50%,-50%);cursor:zoom-out;z-index:8}
#map{display:block;width:240px;height:160px;border-radius:2px}
#mapwrap.big #map{width:min(88vw,960px);height:min(58.7vw,640px)}
#mapwrap .lbl{position:absolute;left:10px;bottom:8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(19,32,44,.7);pointer-events:none}

#place{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;
  text-shadow:0 1px 14px rgba(0,0,0,.7),0 1px 2px rgba(0,0,0,.6);width:min(90vw,560px)}
#placeName{display:block;font-family:var(--display);font-size:32px;font-weight:600;color:var(--parchment);line-height:1.05}
#placeSub{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-top:5px}

#toast{position:fixed;z-index:9;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,calc(-100% - 40px));visibility:hidden;transition:transform .35s ease,visibility 0s .35s;
  background:var(--parchment);color:var(--ink);border-radius:3px;padding:10px 18px;font-size:14px;max-width:min(90vw,460px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .35s ease}
#toast b{font-family:var(--display);font-size:17px;color:var(--prussian)}

#credit{position:fixed;z-index:21;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;color:rgba(244,236,216,.78);text-shadow:0 1px 6px rgba(0,0,0,.85);max-width:calc(100vw - 28px)}
#credit a{color:var(--gold);text-decoration:underline;text-underline-offset:2px}
#credit a:hover{color:#f5d585}
@media (pointer:coarse){#credit{left:auto;right:calc(14px + env(safe-area-inset-right,0px));text-align:right;max-width:55vw}}
#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(244,236,216,.75);z-index:3;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
#hint{position:fixed;z-index:4;right:calc(14px + env(safe-area-inset-right,0px));text-align:right;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:12px;color:rgba(244,236,216,.75);text-shadow:0 1px 6px rgba(0,0,0,.8);pointer-events:none;line-height:1.6}
#stick{display:none;position:fixed;z-index:6;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border-radius:50%;
  border:1px solid rgba(238,196,100,.5);background:rgba(5,24,40,.35);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(238,196,100,.75)}
@media (pointer:coarse){#stick{display:block}#hint{display:none}#cross{display:none}}

@media (max-width:700px){
  .card{width:190px;padding:10px 12px}
  .stat b{font-size:32px}.stat span{font-size:18px}.stats{gap:14px}
  #map{width:150px;height:100px}
  #placeName{font-size:24px}
  #place{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const R=mulberry32(1736);
const pick=a=>a[Math.floor(R()*a.length)];
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch=window.matchMedia&&matchMedia('(pointer: coarse)').matches;

/* ---------------- Geography (1 unit = 1 m; +x east, +z south) ---------------- */
const CH=[
  {hw:42,pts:[[-1500,20],[-900,15],[-500,8],[-230,0]]},                                            // Pregel, west of the split
  {hw:27,pts:[[-230,0],[-190,-72],[-100,-92],[0,-95],[100,-92],[180,-78],[240,-75],[360,-100],[900,-115],[1500,-125]]}, // Old Pregel (north arm)
  {hw:29,pts:[[-230,0],[-190,72],[-100,92],[0,95],[100,92],[180,78],[240,70],[360,105],[900,120],[1500,130]]},          // New Pregel (south arm)
  {hw:22,pts:[[200,-76],[230,0],[200,76]]}                                                         // channel between Kneiphof and Lomse
];
const WSEG=[];
CH.forEach(c=>{for(let i=0;i<c.pts.length-1;i++){const[ax,az]=c.pts[i],[bx,bz]=c.pts[i+1];WSEG.push({ax,az,dx:bx-ax,dz:bz-az,l2:(bx-ax)**2+(bz-az)**2,hw:c.hw});}});
function sdWater(x,z){let m=1e9;for(let i=0;i<WSEG.length;i++){const s=WSEG[i];let t=((x-s.ax)*s.dx+(z-s.az)*s.dz)/s.l2;t=t<0?0:t>1?1:t;const px=s.ax+s.dx*t-x,pz=s.az+s.dz*t-z;const d=Math.sqrt(px*px+pz*pz)-s.hw;if(d<m)m=d;}return m;}
function polyZ(pts,x){for(let i=0;i<pts.length-1;i++){const[ax,az]=pts[i],[bx,bz]=pts[i+1];if(x>=ax&&x<=bx)return az+(bz-az)*(x-ax)/(bx-ax);}return x<pts[0][0]?pts[0][1]:pts[pts.length-1][1];}
function region(x,z){if(x<-230)return z<polyZ(CH[0].pts,x)?'N':'S';if(z<polyZ(CH[1].pts,x))return'N';if(z>polyZ(CH[2].pts,x))return'S';return x<230?'K':'L';}
function landH(x,z){const a=x-70,b=z+300,c=x-20,d=z-520;return 0.5+7*Math.exp(-(a*a+b*b)/24200)+9*Math.exp(-(c*c+d*d)/80000);}
function groundH(x,z,sd){if(sd===undefined)sd=sdWater(x,z);const L=landH(x,z);if(sd>0.5)return L;const t=clamp((sd+3.5)/4,0,1);const s=t*t*(3-2*t);return -3.2+(L+3.2)*s;}
const WATER_Y=-0.6;
const CITY={cx:60,cz:-10,rx:640,rz:430};
const inCity=(x,z)=>{const a=(x-CITY.cx)/CITY.rx,b=(z-CITY.cz)/CITY.rz;return a*a+b*b<1;};

/* Streets: polylines with half-widths */
const STREETS=[
  // Kneiphof
  {hw:5,p:[[-195,0],[205,0]]},{hw:6,p:[[10,-70],[10,70]]},{hw:5,p:[[-120,-62],[-110,62]]},{hw:9,p:[[84,-50],[84,-6]]},
  // North bank: Altstadt, Löbenicht, castle
  {hw:5,p:[[-480,-138],[200,-138],[360,-152],[650,-168]]},
  {hw:5,p:[[-120,-118],[-120,-370]]},{hw:6,p:[[10,-125],[10,-236]]},{hw:14,p:[[-10,-248],[162,-248]]},
  {hw:5,p:[[-480,-205],[-12,-205]]},{hw:5,p:[[162,-205],[650,-215]]},
  {hw:5,p:[[310,-120],[310,-375]]},{hw:5,p:[[-260,-140],[-260,-375]]},{hw:4.5,p:[[-380,-140],[-380,-360]]},
  {hw:4.5,p:[[450,-158],[450,-375]]},{hw:5,p:[[-480,-375],[650,-375]]},{hw:4.5,p:[[560,-162],[560,-375]]},
  {hw:5,p:[[162,-248],[162,-375]]},{hw:4,p:[[-120,-300],[-14,-300]]},
  // South bank: Vorstadt
  {hw:5,p:[[-480,140],[240,140],[360,150],[650,158]]},
  {hw:5,p:[[-110,122],[-110,400]]},{hw:6,p:[[10,128],[10,420]]},{hw:5,p:[[420,140],[420,385]]},
  {hw:5,p:[[-480,240],[650,240]]},{hw:5,p:[[-480,340],[650,340]]},
  {hw:4.5,p:[[-250,140],[-250,400]]},{hw:4.5,p:[[150,140],[150,400]]},{hw:4.5,p:[[260,150],[260,400]]},
  {hw:4.5,p:[[-370,140],[-370,385]]},{hw:4.5,p:[[560,156],[560,385]]},
  // Lomse
  {hw:5,p:[[250,0],[700,0]]},{hw:5,p:[[310,-58],[310,0]]},{hw:5,p:[[420,0],[420,74]]},{hw:4.5,p:[[550,-60],[550,64]]}
];
const SSEG=[];
STREETS.forEach(st=>{for(let i=0;i<st.p.length-1;i++){const[ax,az]=st.p[i],[bx,bz]=st.p[i+1];const len=Math.hypot(bx-ax,bz-az);SSEG.push({ax,az,bx,bz,ux:(bx-ax)/len,uz:(bz-az)/len,len,hw:st.hw});}});
function nearestStreet(x,z){let best=null,bd=1e9,bpx=0,bpz=0;for(const s of SSEG){let t=(x-s.ax)*s.ux+(z-s.az)*s.uz;t=clamp(t,0,s.len);const px=s.ax+s.ux*t,pz=s.az+s.uz*t;const d=Math.hypot(x-px,z-pz)-s.hw;if(d<bd){bd=d;best=s;bpx=px;bpz=pz;}}return{d:bd,s:best,px:bpx,pz:bpz};}

/* The seven bridges (numbering and directorates follow KBI's mapping) */
const BR=[
  {num:'I',  name:'Hohe Brücke',      en:'High Bridge',         dir:'Strategy',       x:420,  z:polyZ(CH[2].pts,420), ux:0,uz:1, L:74, W:7, rail:'#8b8a86', river:'new', ends:'Lomse and the Vorstadt'},
  {num:'II', name:'Holzbrücke',       en:'Wooden Bridge',       dir:'Administration', x:310,  z:polyZ(CH[1].pts,310), ux:0,uz:1, L:70, W:7, rail:'#7a5634', river:'old', ends:'Löbenicht and Lomse'},
  {num:'III',name:'Honigbrücke',      en:'Honey Bridge',        dir:'Communication',  x:230,  z:0,                    ux:1,uz:0, L:64, W:7, rail:'#c39233', river:'main', ends:'Kneiphof and Lomse'},
  {num:'IV', name:'Köttelbrücke',     en:'Giblets Bridge',      dir:'Innovation',     x:-110, z:polyZ(CH[2].pts,-110),ux:0,uz:1, L:74, W:7, rail:'#7b3b2e', river:'new', ends:'Kneiphof and the Vorstadt'},
  {num:'V',  name:'Grüne Brücke',     en:'Green Bridge',        dir:'Education',      x:10,   z:polyZ(CH[2].pts,10),  ux:0,uz:1, L:74, W:8, rail:'#47734a', river:'new', ends:'Kneiphof and the Vorstadt'},
  {num:'VI', name:'Krämerbrücke',     en:"Shopkeepers' Bridge", dir:'Collaboration',  x:10,   z:polyZ(CH[1].pts,10),  ux:0,uz:1, L:70, W:8, rail:'#3d5a7a', river:'old', ends:'Kneiphof and the Altstadt'},
  {num:'VII',name:'Schmiedebrücke',   en:"Blacksmiths' Bridge", dir:'Operations',     x:-120, z:polyZ(CH[1].pts,-120),ux:0,uz:1, L:70, W:7, rail:'#3a3a3e', river:'old', ends:'Kneiphof and the Altstadt'}
];
BR.forEach((b,i)=>{b.i=i;b.hA=groundH(b.x-b.ux*b.L/2,b.z-b.uz*b.L/2);b.hB=groundH(b.x+b.ux*b.L/2,b.z+b.uz*b.L/2);b.inside=false;b.entry=0;});
const deckY=(b,t)=>b.hA+(b.hB-b.hA)*(t/b.L+0.5)+1.7*Math.cos(Math.PI*t/b.L);
function bLocal(b,x,z){const dx=x-b.x,dz=z-b.z;return{t:dx*b.ux+dz*b.uz,s:-dx*b.uz+dz*b.ux};}

function wbox(w,h,d,tu,tv){const g=new THREE.BoxGeometry(w,h,d);const uv=g.attributes.uv;const dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];for(let f=0;f<6;f++)for(let k=0;k<4;k++){const i=f*4+k;uv.setXY(i,uv.getX(i)*dims[f][0]/tu,uv.getY(i)*dims[f][1]/tv);}return g;}
function geoFrom(P,U){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));g.computeVertexNormals();return g;}
function quad(P,U,a,b,c,d,ua,ub,uc,ud){P.push(...a,...b,...c,...a,...c,...d);U.push(...ua,...ub,...uc,...ua,...uc,...ud);}
// Roof with ridge along x: length L, span S, height H. Returns slopes and gable-end triangles.
function roofParts(L,S,H,oL,oS,tu,tv){const P=[],U=[];const a=L/2+oL,b=S/2+oS,e=-oS*H/(S/2);const sl=Math.hypot(b,H-e);
  quad(P,U,[-a,e,-b],[-a,H,0],[a,H,0],[a,e,-b],[0,0],[0,sl/tv],[2*a/tu,sl/tv],[2*a/tu,0]);
  quad(P,U,[a,e,b],[a,H,0],[-a,H,0],[-a,e,b],[0,0],[0,sl/tv],[2*a/tu,sl/tv],[2*a/tu,0]);
  const G=[],GU=[];const s=S/2,x=L/2;G.push(x,0,-s,x,H,0,x,0,s,-x,0,s,-x,H,0,-x,0,-s);
  for(let i=0;i<G.length;i+=3)GU.push((G[i+2]+s)/tu,G[i+1]/tv);
  return{slopes:geoFrom(P,U),gables:geoFrom(G,GU)};}

  for(const s of SSEG){const steps=Math.max(1,Math.ceil(s.len/3));const nx=-s.uz,nz=s.ux;
    for(let k=0;k<steps;k++){const t0=s.len*k/steps,t1=s.len*(k+1)/steps;
      const ax=s.ax+s.ux*t0,az=s.az+s.uz*t0,bx=s.ax+s.ux*t1,bz=s.az+s.uz*t1;

/* ---------------- Tally ---------------- */
const counts=BR.map(()=>0);let total=0,broken=-1,allDone=false;
const blist=$('blist');
BR.forEach(b=>{const li=document.createElement('li');li.innerHTML=`<span class="num">${b.num}</span><span class="nm"><span class="bn"></span> <small></small></span><span class="ct">×0</span>`;blist.appendChild(li);b.li=li;});
function renderList(){BR.forEach(b=>{b.li.querySelector('.bn').textContent=bShort(b);b.li.querySelector('small').textContent=bDir(b);});}
function updateHUD(){const distinct=counts.filter(c=>c>0).length;$('distinct').textContent=distinct;$('total').textContent=total;
  BR.forEach((b,i)=>{b.li.classList.toggle('on',counts[i]>0);b.li.classList.toggle('twice',counts[i]>1);b.li.querySelector('.ct').textContent='×'+counts[i];});
  let msg;
  if(total===0)msg=t('eStart');
  else if(allDone)msg=total===8?t('eAll8'):t('eAllN')(total);
  else if(broken>=0)msg=t('eBroken')(bName(BR[broken]));
  else msg=t('eProg')(distinct);
  $('euler').innerHTML=msg;}
let toastTimer=0;
function toast(html,ms){const el=$('toast');el.innerHTML=html;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),ms||2600);}
function crossed(b){counts[b.i]++;total++;if(counts[b.i]===2&&broken<0&&!allDone)broken=b.i;
  const distinct=counts.filter(c=>c>0).length;
  if(distinct===7&&!allDone){allDone=true;toast(total===8?t('tAll8'):t('tAllN')(total),5200);}
  else toast(`<b>${b.num} · ${bName(b)}</b><br>${counts[b.i]===1?t('first'):t('nth')(counts[b.i])} · ${bDir(b)}`);
  updateHUD();}
function trackBridges(){for(const b of BR){const l=bLocal(b,P.x,P.z);const inside=Math.abs(l.t)<b.L/2&&Math.abs(l.s)<b.W/2+0.6;
  if(inside&&!b.inside){b.inside=true;b.entry=Math.sign(l.t)||1;}
  else if(!inside&&b.inside){b.inside=false;const ex=Math.sign(l.t);if(ex!==0&&ex!==b.entry&&Math.abs(l.t)>b.L/2-12)crossed(b);}}}

  [['Kneiphof',-60,40],['Lomse',470,30],['Altstadt',-200,-170],['Löbenicht',380,-195],['Vorstadt',-200,195],['Pregel',-520,-6]].forEach(([t,x,z])=>{g.fillText(t,X(x),Z(z));});
  g.font='600 15px "Cormorant Garamond", Georgia, serif';g.fillStyle='rgba(110,40,25,.9)';
  g.fillText('Dom',X(136),Z(-52));g.fillText('Schloss',X(70),Z(-344));
  g.strokeStyle='rgba(19,32,44,.5)';g.lineWidth=2;g.strokeRect(1,1,W-2,H-2);})();
function sizeMap(){const r=mapC.getBoundingClientRect();const dpr=Math.min(window.devicePixelRatio||1,2);mapC.width=Math.round(r.width*dpr);mapC.height=Math.round(r.height*dpr);}
function drawMap(){const W=mapC.width,H=mapC.height;if(!W)return;const big=$('mapwrap').classList.contains('big');
  mctx.drawImage(base,0,0,W,H);
  const sx=W/(MAP.x1-MAP.x0),sz=H/(MAP.z1-MAP.z0),X=x=>(x-MAP.x0)*sx,Z=z=>(z-MAP.z0)*sz,u=W/240;
  for(const b of BR){const c=counts[b.i];const ax=b.x-b.ux*b.L*.42,az=b.z-b.uz*b.L*.42,bx=b.x+b.ux*b.L*.42,bz=b.z+b.uz*b.L*.42;
    mctx.lineCap='butt';mctx.strokeStyle='#13202c';mctx.lineWidth=Math.max(5,b.W*sx+3*u);mctx.beginPath();mctx.moveTo(X(ax),Z(az));mctx.lineTo(X(bx),Z(bz));mctx.stroke();
    mctx.strokeStyle=c>1?'#9a6fb0':c>0?'#e2b44a':'#f4ecd8';mctx.lineWidth=Math.max(3,b.W*sx+1*u);mctx.beginPath();mctx.moveTo(X(ax),Z(az));mctx.lineTo(X(bx),Z(bz));mctx.stroke();
    if(big){const dpr=W/mapC.getBoundingClientRect().width;const fs=Math.round(15*dpr);mctx.font=`700 ${fs}px "Cormorant Garamond", Georgia, serif`;mctx.textAlign='center';
      const lx=X(b.x)+(b.ux?0:(b.num==='VI'||b.num==='V'?1:-1)*fs*1.3),lz=Z(b.z)+(b.ux?-fs*1.1:fs*0.35);const txt=b.num+(c?' ×'+c:'');
      mctx.lineWidth=4*dpr;mctx.strokeStyle='rgba(244,236,216,.9)';mctx.strokeText(txt,lx,lz);mctx.fillStyle='#13202c';mctx.fillText(txt,lx,lz);}}
  const px=X(P.x),pz=Z(P.z),fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);const s=Math.max(5,7*u*(big?.55:1));

  mctx.save();mctx.translate(px,pz);mctx.rotate(a0+Math.PI/2);mctx.fillStyle='#b23a2a';mctx.strokeStyle='#fff';mctx.lineWidth=1.5;
  mctx.beginPath();mctx.moveTo(0,-s);mctx.lineTo(s*.7,s*.8);mctx.lineTo(0,s*.4);mctx.lineTo(-s*.7,s*.8);mctx.closePath();mctx.fill();mctx.stroke();mctx.restore();}
function toggleMap(){$('mapwrap').classList.toggle('big');sizeMap();}
$('mapwrap').addEventListener('click',toggleMap);

/* ---------------- Input ---------------- */
const cvs=renderer.domElement;
const locked=()=>document.pointerLockElement===cvs;
let mouseDown=false,lookId=null,lastX=0,lastY=0;
cvs.addEventListener('pointerdown',e=>{if(!started)return;
  if(e.pointerType==='mouse'){mouseDown=true;if(!locked()&&cvs.requestPointerLock){try{const p=cvs.requestPointerLock();if(p&&p.catch)p.catch(()=>{});}catch(_){}}}
  else if(lookId===null){lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;}});
window.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){if(locked()||mouseDown){P.yaw-=e.movementX*0.0024;P.pitch-=e.movementY*0.0024;}}
  else if(e.pointerId===lookId){P.yaw-=(e.clientX-lastX)*0.006;P.pitch-=(e.clientY-lastY)*0.006;lastX=e.clientX;lastY=e.clientY;}
  P.pitch=clamp(P.pitch,-1.35,1.35);});
window.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')mouseDown=false;if(e.pointerId===lookId)lookId=null;});
window.addEventListener('pointercancel',e=>{if(e.pointerId===lookId)lookId=null;});
window.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;keys[e.code]=true;
  if(started&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(started&&e.code==='KeyM')toggleMap();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const stick=$('stick'),knob=$('knob');const joy={id:null,x:0,y:0};
function updJoy(e){const r=stick.getBoundingClientRect();let dx=(e.clientX-(r.left+r.width/2))/(r.width/2),dy=(e.clientY-(r.top+r.height/2))/(r.height/2);const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}joy.x=dx;joy.y=dy;knob.style.transform=`translate(${dx*36}px,${dy*36}px)`;}
stick.addEventListener('pointerdown',e=>{e.stopPropagation();joy.id=e.pointerId;try{stick.setPointerCapture(e.pointerId);}catch(_){}updJoy(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)updJoy(e);});
const joyEnd=e=>{if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;knob.style.transform='';}};
stick.addEventListener('pointerup',joyEnd);stick.addEventListener('pointercancel',joyEnd);

function setBeginLabel(){$('begin').textContent=t(everStarted?'resume':'begin');}
$('begin').addEventListener('click',()=>{const first=!everStarted;started=true;everStarted=true;$('intro').hidden=true;$('hud').hidden=false;sizeMap();lastPlace='';updatePlace(null);
  if(first)P.pitch=0.02;
  if(!isTouch&&cvs.requestPointerLock){try{const p=cvs.requestPointerLock();if(p&&p.catch)p.catch(()=>{});}catch(_){}}
  cvs.focus();
  if(first)setTimeout(()=>toast(t('welcome')),600);});
function openMenu(){started=false;mouseDown=false;lookId=null;joy.id=null;joy.x=joy.y=0;knob.style.transform='';for(const k in keys)keys[k]=false;
  if(locked()&&document.exitPointerLock)document.exitPointerLock();
  $('mapwrap').classList.remove('big');$('toast').classList.remove('show');$('hud').hidden=true;$('intro').hidden=false;setBeginLabel();$('begin').focus();}
$('menu').addEventListener('click',openMenu);
setLang(LANG);

window.addEventListener('resize',()=>{renderer.setSize(app.clientWidth,app.clientHeight);camera.aspect=app.clientWidth/app.clientHeight;camera.updateProjectionMatrix();sizeMap();});

/* ---------------- Loop ---------------- */
const clock=new THREE.Clock();let time=0,mapTick=0;
const baseYaw=P.yaw;
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),0.05);time+=dt;
  if(started){
    let mf=0,ms=0;
    if(keys.KeyW||keys.ArrowUp)mf+=1;if(keys.KeyS||keys.ArrowDown)mf-=1;
    if(keys.KeyD)ms+=1;if(keys.KeyA)ms-=1;
    if(keys.ArrowLeft)P.yaw+=1.8*dt;if(keys.ArrowRight)P.yaw-=1.8*dt;
    mf+=-joy.y;ms+=joy.x;
    const m=Math.hypot(mf,ms);if(m>1){mf/=m;ms/=m;}
    const run=keys.ShiftLeft||keys.ShiftRight||Math.hypot(joy.x,joy.y)>0.92;
    const sp=(run?42:19.5)*dt;
    const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
    const dx=(fx*mf+rx*ms)*sp,dz=(fz*mf+rz*ms)*sp;
    const sub=Math.max(1,Math.ceil(Math.hypot(dx,dz)/0.4));
    for(let k=0;k<sub;k++){if(dx&&canStand(P.x+dx/sub,P.z))P.x+=dx/sub;if(dz&&canStand(P.x,P.z+dz/sub))P.z+=dz/sub;trackBridges();}
  }else if(!everStarted&&!reduceMotion){P.yaw=baseYaw+Math.sin(time*0.12)*0.28;}
  const onB=bridgeAt(P.x,P.z);
  const gy=(onB?deckY(onB.b,onB.t):groundH(P.x,P.z))+1.7;
  P.y+=(gy-P.y)*Math.min(1,dt*10);
  camera.position.set(P.x,P.y,P.z);camera.rotation.set(P.pitch,P.yaw,0);
  sky.position.copy(camera.position);
  sun.position.set(P.x+SUN.x*500,SUN.y*500,P.z+SUN.z*500);sun.target.position.set(P.x,0,P.z);sun.target.updateMatrixWorld();
  if(!reduceMotion){
    T.water.offset.set(time*0.012,time*0.006);
    for(const s of ships){s.g.position.y=WATER_Y+Math.sin(time*1.1+s.ph)*0.12;s.g.rotation.z=Math.sin(time*.8+s.ph)*0.02;}
    for(const h of sails)h.rotation.z-=dt*0.6;
    for(const c of clouds){c.position.x+=dt*4;if(c.position.x>2400)c.position.x=-2400;}
    animateBirds(time,dt);
  }
  npcUpdate(dt,time);
  if(started){updatePlace(onB);mapTick+=dt;if(mapTick>1/20){mapTick=0;drawMap();}}
  renderer.render(scene,camera);}
frame();
window.__kb={P,BR,houses,trees,counts,canStand,step(){trackBridges();}};
})();
